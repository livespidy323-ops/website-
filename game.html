<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mops gegen Pizza 🍕🐶</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ffcf6e,#ff8a8a);min-height:100vh;display:grid;place-items:center;color:#3b2630}
.game{width:min(920px,94vw);background:#fff8;border:3px solid #fff;border-radius:28px;padding:18px;box-shadow:0 20px 60px #7d3f4640;backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:clamp(25px,4vw,42px)}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;padding:9px 14px;border-radius:999px;font-weight:800;box-shadow:0 4px 12px #0001}
#arena{display:block;width:100%;margin-top:14px;border-radius:20px;background:#8ed0ff;cursor:none;touch-action:none}
.controls{text-align:center;margin-top:10px;font-weight:700}.small{opacity:.7;font-size:13px;margin-top:5px}
button{border:0;background:#ff5c7a;color:#fff;font-weight:900;padding:11px 18px;border-radius:999px;cursor:pointer;font-size:15px}button:hover{transform:translateY(-1px)}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:#24131b99}.card{background:#fff;border-radius:25px;padding:30px;text-align:center;box-shadow:0 20px 70px #0005;max-width:420px}.card h2{font-size:36px;margin:0 0 8px}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <h1>🐶 Mops gegen Pizza 🍕</h1>
    <div class="stats">
      <div class="pill">Punkte: <span id="score">0</span></div>
      <div class="pill">Leben: <span id="lives">3</span> ❤️</div>
      <div class="pill">Highscore: <span id="high">0</span></div>
    </div>
  </div>
  <canvas id="arena" width="900" height="560"></canvas>
  <div class="controls">🖱️ Maus bewegen / 📱 Finger ziehen – fange die Pizza, aber nicht die Bomben!</div>
  <div class="small">Goldene Pizza = +1 · Riesige Pizza = +3 · 💣 = aua · Mit jeder Runde wird es schneller.</div>
</div>
<div class="overlay" id="overlay">
  <div class="card">
    <h2>💥 Autsch!</h2>
    <p id="final"></p>
    <button id="restart">Nochmal spielen</button>
  </div>
</div>
<script>
const c=document.getElementById('arena'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),highEl=document.getElementById('high');
const overlay=document.getElementById('overlay'),finalEl=document.getElementById('final');
let high=Number(localStorage.mopsPizzaHigh||0),score=0,lives=3,items=[],running=true,last=0,spawn=0,level=1;
highEl.textContent=high;
const player={x:450,y:485,w:82,h:55};
function reset(){score=0;lives=3;items=[];running=true;spawn=0;level=1;player.x=450;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function pointer(e){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width;player.x=Math.max(45,Math.min(c.width-45,x))}
c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',pointer);
document.getElementById('restart').onclick=reset;

function addItem(){
 const bomb=Math.random()<.16, giant=!bomb&&Math.random()<.12;
 items.push({x:35+Math.random()*(c.width-70),y:-45,r:giant?27:21,bomb,giant,vy:(2.5+Math.random()*2.5)+level*.28,rot:Math.random()*6});
}
function text(t,x,y,size,alpha=1){ctx.globalAlpha=alpha;ctx.font=`900 ${size}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#3b2630';ctx.fillText(t,x,y);ctx.globalAlpha=1}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 const g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#83d5ff');g.addColorStop(1,'#baf0ff');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
 for(let i=0;i<18;i++){ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc((i*97+40)%c.width,70+(i*43)%230,18+(i%3)*8,0,7);ctx.fill()}
 ctx.fillStyle='#76c65b';ctx.fillRect(0,520,c.width,40);
 items.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);text(o.bomb?'💣':o.giant?'🍕':'🍕',0,10,o.r*2);ctx.restore()});
 text('🐶',player.x,player.y,58);
}
function hit(o){return Math.abs(o.x-player.x)<o.r+38 && Math.abs(o.y-(player.y-15))<o.r+30}
function loop(t){
 if(!running)return; const dt=Math.min(32,t-last);last=t; spawn+=dt;
 level=1+Math.floor(score/10);
 if(spawn>Math.max(260,700-level*35)){addItem();spawn=0}
 items.forEach(o=>{o.y+=o.vy*dt/16;o.rot+=.025});
 for(let i=items.length-1;i>=0;i--){
   const o=items[i];
   if(hit(o)){if(o.bomb){lives--;score=Math.max(0,score-2)}else score+=o.giant?3:1;items.splice(i,1);if(lives<=0){end();return}}
   else if(o.y>590){if(!o.bomb)lives--;items.splice(i,1);if(lives<=0){end();return}}
 }
 scoreEl.textContent=score;livesEl.textContent=lives;draw();requestAnimationFrame(loop)
}
function end(){running=false;high=Math.max(high,score);localStorage.mopsPizzaHigh=high;highEl.textContent=high;finalEl.innerHTML=`Der Mops hat <b>${score} Punkte</b> gesammelt.<br>Highscore: <b>${high}</b> 🏆`;overlay.style.display='grid'}
reset();
</script>
</body>
</html>
